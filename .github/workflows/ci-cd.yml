name: CI-CD Pipeline

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    types: [closed]
    branches:
      - trunk

jobs:
  build:
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    name: Build and Test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build test

      - name: Copiar .jar a directorio temporal
        run: |
          mkdir -p artifact
          cp applications/app-service/build/libs/*.jar artifact/

      - name: Subir artifact fijo
        uses: actions/upload-artifact@v4
        with:
          name: app-artifact
          path: artifact/

  release:
    if: github.event.pull_request.merged == true
    needs: build
    runs-on: ubuntu-latest
    name: Release to ECS

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Descargar artifact del build
        uses: actions/download-artifact@v4
        with:
          name: app-artifact
          path: build/libs

      - name: Renombrar .jar para Docker
        run: |
          JAR_ORIGINAL=$(ls build/libs/*.jar | head -n 1)
          cp "$JAR_ORIGINAL" build/libs/health-check-service.jar

      - name: Set Docker image name
        run: echo "IMAGE_TAG=release-${{ github.run_number }}" >> $GITHUB_ENV

      - name: Simular Docker build
        run: |
          echo "Simulando login a ECR"
          echo "Simulando docker build"
          docker build -t health-check-service:$IMAGE_TAG -f deployment/Dockerfile .

      - name: Simular push a ECR
        run: |
          echo "Simulando push a ECR"
          echo "docker tag health-check-service:$IMAGE_TAG fake-ecr-url/health-check-service:$IMAGE_TAG"
          echo "docker push fake-ecr-url/health-check-service:$IMAGE_TAG"

      - name: Simular deploy a ECS
        run: |
          echo "Simulando deploy a ECS"
          echo "aws ecs update-service --cluster fake-cluster --service fake-service --force-new-deployment"