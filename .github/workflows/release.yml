name: release-service

on:
  workflow_run:
    workflows: ["build-service"]
    types:
      - completed

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'trunk' }}
    name: Docker Build and Push to LocalStack
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack
        ports:
          - 4566:4566
        env:
          SERVICES: ecr,ecs
          DEBUG: 1
          DOCKER_HOST: unix:///var/run/docker.sock

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-artifact
          path: artifact

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS CLI for LocalStack
        run: |
          aws configure set aws_access_key_id test
          aws configure set aws_secret_access_key test
          aws configure set default.region us-east-1
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

      - name: Create ECR repo in LocalStack
        run: |
          aws --endpoint-url=http://localhost:4566 ecr create-repository --repository-name local-ecr-repo || true

      - name: Build Docker image
        run: |
          docker build -t health-check-service -f deployment/Dockerfile .

      - name: Tag and Push to ECR LocalStack
        run: |
          docker tag health-check-service localhost:4566/local-ecr-repo
          docker push localhost:4566/local-ecr-repo || echo "Simulated push"

      - name: Simulate ECS deploy
        run: |
          aws --endpoint-url=http://localhost:4566 ecs create-cluster --cluster-name local-ecs-cluster || true
          echo "Simulated ECS deployment..."