name: build-service

on:
  push:
    branches:
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build test

      - name: Copiar .jar a directorio temporal
        run: |
          mkdir -p artifact
          cp applications/app-service/build/libs/*.jar artifact/

      - name: Subir artifact fijo
        uses: actions/upload-artifact@v4
        with:
          name: app-artifact
          path: artifact/