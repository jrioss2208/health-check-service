name: ci-cd-pipeline

on:
  push:
    branches:
      - trunk
      - 'feature/**'

env:
  IMAGE_NAME: health-check-service
  ECR_REPO_NAME: local-ecr-repo
  LOCALSTACK_ECS_CLUSTER: local-ecs-cluster

jobs:

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build test

      - name: Copy artifacts
        run: |
          mkdir -p artifact
          cp applications/app-service/build/libs/*.jar artifact/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-artifact
          path: artifact/

  release:
    name: Docker Build and Push to LocalStack ECR
    runs-on: ubuntu-latest
    needs: build
    services:
      localstack:
        image: localstack/localstack
        ports:
          - 4566:4566
        env:
          SERVICES: ecr,ecs
          DEBUG: 1
          DOCKER_HOST: unix:///var/run/docker.sock

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-artifact
          path: artifact

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS CLI for LocalStack
        run: |
          aws configure set aws_access_key_id test
          aws configure set aws_secret_access_key test
          aws configure set default.region us-east-1
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

      - name: Create ECR Repository in LocalStack
        run: |
          aws --endpoint-url=http://localhost:4566 ecr create-repository --repository-name $ECR_REPO_NAME || true

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME -f deployment/Dockerfile .

      - name: Tag and Push Docker image to LocalStack ECR
        run: |
          ECR_URL="localhost:4566/$ECR_REPO_NAME"
          docker tag $IMAGE_NAME $ECR_URL
          docker push $ECR_URL || echo "Simulated push to LocalStack"

      - name: Simulate ECS Cluster and Task Registration
        run: |
          aws --endpoint-url=http://localhost:4566 ecs create-cluster --cluster-name $LOCALSTACK_ECS_CLUSTER || true
          echo "Simulated ECS task definition and service deployment..."