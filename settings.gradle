pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url 'https://jitpack.io' } // opcional si usas plugins de GitHub
    }
}




rootProject.name = 'health-check-service'


include ':app-service'
project(':app-service').projectDir = file('./applications/app-service')
include ':api-rest'
project(':api-rest').projectDir = file('./infrastructure/entry-points/api-rest')
include ':model'
project(':model').projectDir = file('./domain/model')
include ':usecase'
project(':usecase').projectDir = file('./domain/usecase')

